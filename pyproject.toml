[project]
name = "endeavor-local-agent-lite"
version = "0.1.0"
description = "Local-first Thai AI agent for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "ddgs",
    "fastapi",
    "httpx",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "mlx-vlm",
    # mcp 2.x removed mcp.server.fastmcp (renamed MCPServer); MCP-RagDoc/rag_server.py
    # and tools/mcp_client.py are written for the 1.x API.
    "mcp>=1.0,<2",
    "numpy",
    "opencv-python",
    "openpyxl",
    "onnxruntime>=1.20",
    "Pillow",
    "PyMuPDF",
    "pythainlp>=5.0",
    "python-docx",
    "rich",
    "sentencepiece>=0.2",
    "uvicorn[standard]",
    "xlrd",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["test_suite"]
addopts = "-q"
