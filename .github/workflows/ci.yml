name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Build OCR helper
        run: xcrun swiftc helpers/_vision_ocr.swift -o helpers/vision_ocr_macos
      - name: Run deterministic tests
        run: python -m pytest test_suite -q
